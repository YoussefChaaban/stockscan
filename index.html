<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GreenVine Scan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7f2;
    --surface: #ffffff;
    --surface2: #eef2ea;
    --green-dark: #2d5a1b;
    --green-mid: #3d7a25;
    --green-light: #5a9e3a;
    --green-pale: #d4e8c8;
    --accent: #e8621a;
    --text: #1a2e10;
    --muted: #7a8f70;
    --danger: #c0392b;
    --border: #d0dcc8;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  button, input, textarea, select { touch-action: manipulation; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ─── PIN LOGIN ─────────────────────────────────────── */
  #pin-screen {
    position: fixed; inset: 0; background: var(--green-dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; gap: 0;
  }

  .pin-logo {
    margin-bottom: 28px;
  }

  .pin-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px; font-weight: 900; color: var(--white);
    letter-spacing: -0.5px; margin-bottom: 4px;
  }

  .pin-sub {
    font-size: 12px; color: var(--green-pale); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 36px;
  }

  .pin-display {
    display: flex; gap: 14px; margin-bottom: 32px;
  }

  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--green-pale); background: transparent;
    transition: background 0.15s;
  }

  .pin-dot.filled { background: var(--green-pale); }

  .pin-keypad {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; width: 260px;
  }

  .pin-key {
    height: 64px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.1); color: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 600;
    cursor: pointer; transition: all 0.1s; display: flex;
    align-items: center; justify-content: center;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  .pin-key:active { background: rgba(255,255,255,0.25); transform: scale(0.95); }
  .pin-key.delete { font-size: 18px; background: rgba(255,255,255,0.05); }
  .pin-key.empty  { background: transparent; cursor: default; }

  .pin-error {
    margin-top: 20px; color: #ff8a80; font-size: 13px;
    font-weight: 600; min-height: 20px; text-align: center;
  }

  .pin-staff-name {
    margin-top: 16px; color: var(--green-pale); font-size: 13px;
    font-weight: 500; min-height: 20px;
  }

  /* ─── HEADER ────────────────────────────────────────── */
  #app { display: none; flex-direction: column; flex: 1; }

  header {
    background: var(--green-dark); padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; position: sticky; top: 0; z-index: 50;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }

  .logo-wrap { display: flex; align-items: center; gap: 10px; }

  .logo-text { display: flex; flex-direction: column; line-height: 1; }
  .logo-top { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 900; color: var(--white); }
  .logo-bottom { font-size: 10px; color: var(--green-pale); letter-spacing: 2px; text-transform: uppercase; font-weight: 500; margin-top: 1px; }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .staff-chip {
    font-size: 11px; color: var(--green-pale); font-weight: 600;
    background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px;
  }

  .order-badge {
    background: var(--accent); color: var(--white);
    font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 20px;
    cursor: pointer; border: none; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .order-badge:active { transform: scale(0.95); }

  /* ─── TABS ───────────────────────────────────────────── */
  .tabs { display: flex; background: var(--green-dark); border-bottom: 3px solid var(--green-mid); }
  .tab {
    flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 600;
    color: var(--green-pale); cursor: pointer; border-bottom: 3px solid transparent;
    margin-bottom: -3px; transition: all 0.2s; letter-spacing: 0.8px; text-transform: uppercase;
  }
  .tab.active { color: var(--white); border-bottom-color: var(--accent); background: rgba(255,255,255,0.05); }

  .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
  .view.active { display: flex; }

  /* ─── CONTROLS ───────────────────────────────────────── */
  .btn {
    flex: 1; padding: 13px; border: none; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--green-mid); color: var(--white); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .manual-input { padding: 0 16px 14px; display: flex; gap: 8px; }
  .manual-input input {
    flex: 1; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 11px 14px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .manual-input input:focus { border-color: var(--green-mid); }
  .manual-input input::placeholder { color: var(--muted); }
  .manual-input button {
    padding: 11px 16px; background: var(--green-pale); border: 1.5px solid var(--green-mid);
    border-radius: 8px; color: var(--green-dark); font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }

  /* ─── PRODUCT CARD ───────────────────────────────────── */
  .product-card {
    margin: 0 12px 10px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; overflow: hidden; display: none;
    box-shadow: 0 2px 12px rgba(45,90,27,0.08);
  }
  .product-card.visible { display: block; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .product-card-body { padding: 12px; }

  .product-upc { font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; }
  .unknown-hint { font-size: 11px; color: var(--accent); margin-bottom: 10px; font-weight: 600; display: none; background: #fff5f0; border: 1px solid #f5c6a0; border-radius: 6px; padding: 8px 10px; }

  .product-name-input {
    width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--border);
    font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700;
    color: var(--text); outline: none; padding: 2px 0 4px; margin-bottom: 4px; transition: border-color 0.2s;
  }
  .product-name-input:focus { border-bottom-color: var(--green-mid); }

  .product-brand-input {
    width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--border);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--green-mid); outline: none; padding: 2px 0 4px; margin-bottom: 8px; transition: border-color 0.2s;
  }
  .product-brand-input:focus { border-bottom-color: var(--green-mid); }

  .product-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .meta-box { background: var(--surface2); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); }
  .meta-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }

  .stock-edit { display: flex; align-items: center; gap: 6px; }
  .stock-edit input {
    width: 54px; background: var(--white); border: 1.5px solid var(--border); border-radius: 6px;
    padding: 5px; color: var(--text); font-size: 18px; font-weight: 700; text-align: center; outline: none;
  }
  .stock-edit input:focus { border-color: var(--green-mid); }
  .stock-edit button {
    width: 28px; height: 28px; border: 1.5px solid var(--border); border-radius: 6px;
    background: var(--white); color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .stock-edit button:hover { background: var(--green-pale); }

  /* Notes */
  .notes-row { margin-bottom: 14px; }
  .notes-row label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: 600; }
  .notes-row textarea {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none;
    transition: border-color 0.2s; resize: none; height: 64px; line-height: 1.5;
  }
  .notes-row textarea:focus { border-color: var(--green-mid); }
  .notes-row textarea::placeholder { color: var(--muted); }

  .vendor-row { margin-bottom: 8px; }
  .vendor-row label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 600; }
  .vendor-row input {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 8px 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .vendor-row input:focus { border-color: var(--green-mid); }
  .vendor-row input::placeholder { color: var(--muted); }
  .vendor-saved { font-size: 11px; color: var(--green-mid); margin-top: 4px; font-weight: 600; }

  .order-section { display: flex; gap: 8px; align-items: flex-end; padding-top: 8px; border-top: 1.5px solid var(--border); }
  .order-qty-wrap { flex: 1; }
  .order-qty-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
  .qty-stepper { display: flex; align-items: center; gap: 6px; }
  .qty-stepper button {
    width: 30px; height: 30px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-stepper button:hover { background: var(--green-pale); }
  .qty-stepper input {
    width: 46px; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 5px; color: var(--text); font-size: 16px; font-weight: 700; text-align: center; outline: none;
  }

  /* ─── Compact quantity keypad (replaces the full OS keyboard) ────── */
  .mini-keypad {
    display: none; grid-template-columns: repeat(3, 1fr); gap: 5px;
    margin-top: 6px; padding: 6px; background: var(--surface2);
    border: 1.5px solid var(--border); border-radius: 10px;
  }
  .mini-keypad.visible { display: grid; }
  .mini-keypad button {
    height: 32px; border: none; border-radius: 7px; background: var(--white);
    border: 1.5px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .mini-keypad button:active { background: var(--green-pale); transform: scale(0.96); }
  .mini-keypad .mk-clear { color: var(--danger); font-size: 12px; }
  .mini-keypad .mk-back  { font-size: 15px; }
  .mini-keypad .mk-go    { background: var(--green-mid); color: var(--white); border-color: var(--green-mid); }

  .btn-add-order {
    padding: 10px 16px; background: var(--green-dark); color: var(--white); border: none;
    border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .btn-add-order:hover { background: var(--green-mid); }
  .btn-add-order:active { transform: scale(0.95); }
  .btn-add-order:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ─── TOAST ──────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green-dark); color: var(--white); padding: 12px 20px;
    border-radius: 50px; font-weight: 600; font-size: 13px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100; white-space: nowrap; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  /* ─── LIST VIEWS ─────────────────────────────────────── */
  .view-header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); }
  .view-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--green-dark); }
  .count-chip { font-size: 11px; background: var(--green-pale); color: var(--green-dark); padding: 4px 10px; border-radius: 20px; font-weight: 600; }

  /* Search bar */
  .search-wrap { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .search-wrap input {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 9px 14px 9px 36px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--green-mid); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap { position: relative; }
  .search-icon { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

  .item-list { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; }

  .inv-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .inv-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .inv-info { flex: 1; min-width: 0; }
  .inv-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inv-brand { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .inv-notes { font-size: 11px; color: var(--accent); margin-top: 2px; font-style: italic; }
  .inv-stock { font-size: 18px; font-weight: 700; flex-shrink: 0; }

  .order-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .order-info { flex: 1; min-width: 0; }
  .order-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .order-meta span { color: var(--green-mid); font-weight: 500; }
  .order-qty-badge { background: var(--green-dark); color: var(--white); font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 20px; flex-shrink: 0; }

  .export-bar { padding: 14px 16px; border-top: 1.5px solid var(--border); background: var(--surface); margin-top: auto; }
  .export-bar-row { display: flex; gap: 10px; }

  .loading-state { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 13px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--green-pale); border-top-color: var(--green-mid); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-card { margin: 0 16px 12px; background: #fff8f7; border: 1.5px solid #f5c6c0; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--danger); }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .empty-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.5; }
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="pin-logo">
    <svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="45" cy="45" r="42" fill="#3d7a25" stroke="#5a9e3a" stroke-width="2"/>
      <circle cx="45" cy="45" r="32" fill="none" stroke="#d4e8c8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Vine leaves around circle -->
      <ellipse cx="45" cy="16" rx="4" ry="6" fill="#5a9e3a" transform="rotate(0 45 16)"/>
      <ellipse cx="65" cy="24" rx="4" ry="6" fill="#5a9e3a" transform="rotate(60 65 24)"/>
      <ellipse cx="74" cy="45" rx="4" ry="6" fill="#5a9e3a" transform="rotate(90 74 45)"/>
      <ellipse cx="65" cy="66" rx="4" ry="6" fill="#5a9e3a" transform="rotate(120 65 66)"/>
      <ellipse cx="45" cy="74" rx="4" ry="6" fill="#5a9e3a" transform="rotate(0 45 74)"/>
      <ellipse cx="25" cy="66" rx="4" ry="6" fill="#5a9e3a" transform="rotate(-120 25 66)"/>
      <ellipse cx="16" cy="45" rx="4" ry="6" fill="#5a9e3a" transform="rotate(90 16 45)"/>
      <ellipse cx="25" cy="24" rx="4" ry="6" fill="#5a9e3a" transform="rotate(-60 25 24)"/>
      <!-- GV text -->
      <text x="45" y="40" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="white">GREEN</text>
      <text x="45" y="54" text-anchor="middle" font-family="serif" font-size="10" fill="#d4e8c8" letter-spacing="3">VINE</text>
      <text x="45" y="65" text-anchor="middle" font-family="serif" font-size="7" fill="#d4e8c8" letter-spacing="2">MARKET</text>
    </svg>
  </div>
  <div class="pin-title">GreenVine Scan</div>
  <div class="pin-sub">Enter your PIN to continue</div>
  <div class="pin-display">
    <div class="pin-dot" id="dot-0"></div>
    <div class="pin-dot" id="dot-1"></div>
    <div class="pin-dot" id="dot-2"></div>
    <div class="pin-dot" id="dot-3"></div>
  </div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="pinPress('1')" ontouchend="event.preventDefault();pinPress('1')">1</button>
    <button class="pin-key" onclick="pinPress('2')" ontouchend="event.preventDefault();pinPress('2')">2</button>
    <button class="pin-key" onclick="pinPress('3')" ontouchend="event.preventDefault();pinPress('3')">3</button>
    <button class="pin-key" onclick="pinPress('4')" ontouchend="event.preventDefault();pinPress('4')">4</button>
    <button class="pin-key" onclick="pinPress('5')" ontouchend="event.preventDefault();pinPress('5')">5</button>
    <button class="pin-key" onclick="pinPress('6')" ontouchend="event.preventDefault();pinPress('6')">6</button>
    <button class="pin-key" onclick="pinPress('7')" ontouchend="event.preventDefault();pinPress('7')">7</button>
    <button class="pin-key" onclick="pinPress('8')" ontouchend="event.preventDefault();pinPress('8')">8</button>
    <button class="pin-key" onclick="pinPress('9')" ontouchend="event.preventDefault();pinPress('9')">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinPress('0')" ontouchend="event.preventDefault();pinPress('0')">0</button>
    <button class="pin-key delete" onclick="pinDelete()" ontouchend="event.preventDefault();pinDelete()">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-staff-name" id="pin-staff-name"></div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="logo-wrap">
      <svg width="36" height="36" viewBox="0 0 90 90" fill="none">
        <circle cx="45" cy="45" r="42" fill="#3d7a25"/>
        <circle cx="45" cy="45" r="32" fill="none" stroke="#d4e8c8" stroke-width="1.5" stroke-dasharray="4 3"/>
        <ellipse cx="45" cy="16" rx="4" ry="6" fill="#5a9e3a"/>
        <ellipse cx="65" cy="24" rx="4" ry="6" fill="#5a9e3a" transform="rotate(60 65 24)"/>
        <ellipse cx="74" cy="45" rx="4" ry="6" fill="#5a9e3a" transform="rotate(90 74 45)"/>
        <ellipse cx="65" cy="66" rx="4" ry="6" fill="#5a9e3a" transform="rotate(120 65 66)"/>
        <ellipse cx="45" cy="74" rx="4" ry="6" fill="#5a9e3a"/>
        <ellipse cx="25" cy="66" rx="4" ry="6" fill="#5a9e3a" transform="rotate(-120 25 66)"/>
        <ellipse cx="16" cy="45" rx="4" ry="6" fill="#5a9e3a" transform="rotate(90 16 45)"/>
        <ellipse cx="25" cy="24" rx="4" ry="6" fill="#5a9e3a" transform="rotate(-60 25 24)"/>
        <text x="45" y="40" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="white">GREEN</text>
        <text x="45" y="52" text-anchor="middle" font-family="serif" font-size="9" fill="#d4e8c8" letter-spacing="2">VINE</text>
      </svg>
      <div class="logo-text">
        <span class="logo-top">GreenVine</span>
        <span class="logo-bottom">Scan</span>
      </div>
    </div>
    <div class="header-right">
      <div class="staff-chip" id="staff-chip">👤 —</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxitPdYJYZZqCzz8_Ncf1g0gchsABE1NssFaezAr7gtZuyx9GU3J3qwest3MwSsyXKoXA/exec';

let currentProduct = null;
let ordersCache    = [];
let inventoryCache = [];
let currentStaff   = '';
let pinBuffer      = '';
let productDirty   = false;   // only save product if the user actually edited a field
let productsCache  = null;    // { [normalizedUPC]: {name, vendor, weight} } — preloaded for instant scan lookup
let stockCache     = null;    // { [normalizedUPC]: {stock, notes} } — preloaded for instant scan lookup
let cacheReady     = false;

// ─── API ──────────────────────────────────────────────────
async function api(params) {
  try {
    const res = await fetch(API_URL + '?' + new URLSearchParams(params), { method: 'GET' });
    return JSON.parse(await res.text());
  } catch (e) { return { error: e.message }; }
}

// ─── PIN ──────────────────────────────────────────────────
function pinPress(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
  if (pinBuffer.length === 4) {
    setTimeout(checkPin, 150);
  }
}

function pinDelete() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('dot-' + i).classList.toggle('filled', i < pinBuffer.length);
  }
}

async function checkPin() {
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-staff-name').textContent = 'Checking...';

  try {
    const result = await api({ action: 'verifyPin', pin: pinBuffer });
    if (result.success) {
      currentStaff = result.name;
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('staff-chip').textContent = '👤 ' + currentStaff;
      // Auto-focus UPC field for scanner
      setTimeout(() => document.getElementById('manual-upc').focus(), 100);
    } else {
      document.getElementById('pin-error').textContent = 'Incorrect PIN. Try again.';
      document.getElementById('pin-staff-name').textContent = '';
      pinBuffer = '';
      updatePinDots();
    }
  } catch (e) {
    document.getElementById('pin-error').textContent = 'Connection error. Try again.';
    document.getElementById('pin-staff-name').textContent = '';
    pinBuffer = '';
    updatePinDots();
  }
}

// ─── Tabs ─────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['scan','inventory','orders'][i] === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'scan')      setTimeout(() => document.getElementById('manual-upc').focus(), 100);
  if (name === 'inventory') loadInventory();
  if (name === 'orders')    loadOrders();
}

// ─── Cache preload (makes scans instant) ───────────────────
// Strategy: ask the sheet's file for its last-modified timestamp (one tiny,
// fast call). If it matches what we already have saved locally, use that
// local copy instantly — no need to re-download the whole catalog. If it's
// different (or we've never cached before), do the full fetch once and save it.
const CACHE_KEY = 'gv_catalog_cache_v1';

async function preloadCache(force) {
  try {
    const versionResult  = await api({ action: 'getVersion' });
    const remoteVersion  = versionResult && versionResult.version;
    const savedRaw       = localStorage.getItem(CACHE_KEY);
    const saved          = savedRaw ? safeParse(savedRaw) : null;

    if (!force && saved && remoteVersion && saved.version === remoteVersion) {
      // Nothing changed in the sheet since we last cached — use it as-is, instantly.
      productsCache = saved.products;
      stockCache    = saved.inventory;
      cacheReady    = true;
      return;
    }

    // Stale, missing, or forced — do one full fetch and save it for next time.
    const [products, inventory] = await Promise.all([
      api({ action: 'getAllProducts' }),
      api({ action: 'getInventory' })
    ]);

    productsCache = {};
    (products.items || []).forEach(p => { productsCache[normalizeUPCClient(p.upc)] = p; });
    stockCache = {};
    (inventory.items || []).forEach(i => { stockCache[normalizeUPCClient(i.upc)] = i; });
    cacheReady = true; // in-memory cache is good from here on regardless of what happens below

    // Persisting to localStorage is a nice-to-have (instant load next time) —
    // isolate it so a quota error on a huge catalog can't wipe the good
    // in-memory cache we just built.
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        version: remoteVersion, products: productsCache, inventory: stockCache
      }));
    } catch (storageErr) {
      // Too big for localStorage on this device — fine, we still have it in
      // memory for this session; it'll just re-fetch fresh next time the page loads.
    }
  } catch (e) {
    // Network hiccup — fall back to whatever we have saved locally, even if stale,
    // rather than leaving the app with nothing.
    const savedRaw = localStorage.getItem(CACHE_KEY);
    const saved    = savedRaw ? safeParse(savedRaw) : null;
    if (saved) {
      productsCache = saved.products;
      stockCache    = saved.inventory;
      cacheReady    = true;
    } else {
      cacheReady = false; // lookupUPC() will fall back to a live per-scan API call
    }
  }
}

function safeParse(str) { try { return JSON.parse(str); } catch (e) { return null; } }

function normalizeUPCClient(upc) {
  return String(upc).replace(/^0+/, '');
}

// ─── Lookup ───────────────────────────────────────────────
function lookupManual() {
  const val = document.getElementById('manual-upc').value.trim();
  if (val) lookupUPC(val);
}

async function lookupUPC(upc) {
  document.getElementById('product-card').classList.remove('visible');
  document.getElementById('error-msg').style.display = 'none';

  const norm = normalizeUPCClient(upc);

  // Instant path — served entirely from memory, no network wait
  if (cacheReady && productsCache && stockCache) {
    const p = productsCache[norm];
    const s = stockCache[norm];
    showProduct({
      upc,
      name:      p ? (p.name   || '') : '',
      brand:     '',
      vendor:    p ? (p.vendor || '') : '',
      weight:    p ? (p.weight || '') : '',
      stock:     s ? s.stock : 0,
      notes:     s ? (s.notes || '') : '',
      isKnown:   !!s,
      foundInDB: !!p || !!s
    });
    return;
  }

  // Fallback: cache not ready yet (e.g. right after login) — hit the network once
  document.getElementById('loading').style.display = 'block';
  try {
    let catalogData, inventoryData;
    const combined = await api({ action: 'lookup', upc });

    if (combined && combined.catalog) {
      catalogData   = combined.catalog;
      inventoryData = combined.inventory;
    } else {
      [catalogData, inventoryData] = await Promise.all([
        api({ action: 'lookupProduct', upc }),
        api({ action: 'getProduct', upc })
      ]);
    }

    document.getElementById('loading').style.display = 'none';

    showProduct({
      upc,
      name:      catalogData.found ? (catalogData.name   || '') : '',
      brand:     '',
      vendor:    catalogData.found ? (catalogData.vendor || '') : '',
      weight:    catalogData.found ? (catalogData.weight || '') : '',
      stock:     inventoryData.found ? inventoryData.stock : 0,
      notes:     inventoryData.found ? (inventoryData.notes || '') : '',
      isKnown:   inventoryData.found,
      foundInDB: catalogData.found || inventoryData.found
    });

  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    showError('Network error. Check your connection.');
  }
}

function showProduct(product) {
  currentProduct = product;
  productDirty   = false;
  qtyFresh       = true;

  document.getElementById('p-upc').textContent          = 'UPC: ' + product.upc;
  document.getElementById('p-name').value               = product.name   || '';
  document.getElementById('p-brand').value              = product.brand  || '';
  document.getElementById('p-stock').value              = product.stock  || 0;
  document.getElementById('p-vendor').value             = product.vendor || '';
  document.getElementById('p-notes').value              = product.notes  || '';
  document.getElementById('p-weight').textContent       = product.weight || '—';
  document.getElementById('order-qty').value            = 1;
  document.getElementById('unknown-hint').style.display = product.foundInDB ? 'none' : 'block';
  document.getElementById('vendor-saved').style.display = (product.isKnown && product.vendor) ? 'block' : 'none';
  document.getElementById('product-card').classList.add('visible');
  document.getElementById('qty-keypad').classList.add('visible');

  // Focus (but don't select-all, since the custom keypad below handles
  // typed entry) so the scanner's *next* barcode, if you scan one instead
  // of tapping a quantity, lands in this field and triggers the
  // auto-default-to-1-and-move-on behavior in the keydown handler.
  setTimeout(() => document.getElementById('order-qty').focus(), 30);
}

// ─── Save (only when the user actually edited something) ──
function markDirty() { productDirty = true; }

async function saveProductData() {
  if (!currentProduct) return;
  const name   = document.getElementById('p-name').value.trim();
  const brand  = document.getElementById('p-brand').value.trim();
  const stock  = parseInt(document.getElementById('p-stock').value) || 0;
  const vendor = document.getElementById('p-vendor').value.trim();
  const notes  = document.getElementById('p-notes').value.trim();
  currentProduct = { ...currentProduct, name, brand, stock, vendor, notes };
  await api({ action: 'saveProduct', upc: currentProduct.upc, name, brand, vendor, stock, notes });
  productDirty = false;

  // Reflect the edit in the local cache immediately, so the Inventory tab
  // shows fresh data without waiting for the next background version check.
  if (stockCache) {
    const norm = normalizeUPCClient(currentProduct.upc);
    stockCache[norm] = { upc: currentProduct.upc, name, brand, vendor, stock, notes };
  }
}

function adjustStock(delta) {
  const input = document.getElementById('p-stock');
  input.value = Math.max(0, parseInt(input.value || 0) + delta);
  markDirty();
}

function adjustQty(delta) {
  const input = document.getElementById('order-qty');
  input.value = Math.max(1, parseInt(input.value || 1) + delta);
  qtyFresh = false;
}

// ─── Compact quantity keypad ────────────────────────────────
// A qtyFresh flag tracks whether the field still shows its untouched
// default ('1' right after a scan) — the first tap replaces it instead
// of appending, so tapping "5" gives you "5" instead of "15".
let qtyFresh = true;

function keypadPress(digit) {
  const input = document.getElementById('order-qty');
  input.value = qtyFresh ? digit : (input.value + digit);
  qtyFresh = false;
}

function keypadBackspace() {
  const input = document.getElementById('order-qty');
  input.value = input.value.slice(0, -1);
  qtyFresh = false;
}

function keypadClear() {
  document.getElementById('order-qty').value = '';
  qtyFresh = false;
}

// ─── Add to order ─────────────────────────────────────────
// The UI resets for the next scan the INSTANT you hit Enter — the actual
// write to the sheet happens in the background afterward. If it fails
// (network blip, etc.), it's queued and auto-retried once, then flagged
// with a visible "Retry" badge on the Orders tab as a safety net. Nothing
// is ever silently lost — it's either saved or clearly flagged as failed.
let failedOrders = [];

function buildOrderPayload() {
  if (!currentProduct) return null;
  const name = document.getElementById('p-name').value.trim();
  if (!name) { showToast('Please enter a product name first', true); return null; }

  return {
    upc:    currentProduct.upc,
    name,
    brand:  document.getElementById('p-brand').value.trim(),
    vendor: document.getElementById('p-vendor').value.trim(),
    weight: currentProduct.weight || '',
    qty:    parseInt(document.getElementById('order-qty').value) || 1,
    stock:  parseInt(document.getElementById('p-stock').value) || 0,
    notes:  document.getElementById('p-notes').value.trim(),
    staff:  currentStaff,
    needsProductSave: productDirty,
    _retried: false
  };
}

// Shows up immediately in the order count/toast — the network call happens
// after, without blocking the UI from moving on to the next scan.
function queueOrder(payload) {
  ordersCache.push({
    upc: payload.upc, name: payload.name, brand: payload.brand, vendor: payload.vendor,
    weight: payload.weight, qty: payload.qty, staff: payload.staff
  });
  document.getElementById('order-count').textContent = ordersCache.length;
  showToast(`✓ ${payload.qty}× ${payload.name} → ${payload.vendor || 'Unknown Vendor'}`);
  sendOrderInBackground(payload); // fire-and-forget — not awaited
}

async function sendOrderInBackground(payload) {
  try {
    const calls = [
      api({ action: 'addOrder', upc: payload.upc, name: payload.name, brand: payload.brand, vendor: payload.vendor, weight: payload.weight, qty: payload.qty, staff: payload.staff })
    ];
    if (payload.needsProductSave) {
      calls.push(api({ action: 'saveProduct', upc: payload.upc, name: payload.name, brand: payload.brand, vendor: payload.vendor, stock: payload.stock, notes: payload.notes }));
      if (stockCache) {
        const norm = normalizeUPCClient(payload.upc);
        stockCache[norm] = { upc: payload.upc, name: payload.name, brand: payload.brand, vendor: payload.vendor, stock: payload.stock, notes: payload.notes };
      }
    }
    const [result] = await Promise.all(calls);
    if (result && result.error) throw new Error(result.error);
  } catch (e) {
    failedOrders.push(payload);
    updateFailedBadge();
    if (!payload._retried) {
      payload._retried = true;
      showToast(`⚠ Save failed for ${payload.qty}× ${payload.name} — retrying...`, true);
      setTimeout(() => retrySingleOrder(payload), 4000);
    } else {
      showToast(`⚠ Still failing to save ${payload.qty}× ${payload.name} — check Orders tab`, true);
    }
  }
}

async function retrySingleOrder(payload) {
  const idx = failedOrders.indexOf(payload);
  if (idx !== -1) failedOrders.splice(idx, 1);
  updateFailedBadge();
  await sendOrderInBackground(payload);
}

async function retryFailedOrders() {
  if (!failedOrders.length) return;
  const toRetry = failedOrders.slice();
  failedOrders = [];
  updateFailedBadge();
  showToast(`Retrying ${toRetry.length} order${toRetry.length === 1 ? '' : 's'}...`);
  for (const payload of toRetry) {
    await sendOrderInBackground(payload);
  }
}

function updateFailedBadge() {
  const el = document.getElementById('failed-badge');
  if (!el) return;
  if (failedOrders.length > 0) {
    el.style.display = 'inline-block';
    el.textContent = `⚠ ${failedOrders.length} failed — Retry`;
  } else {
    el.style.display = 'none';
  }
}

// Add order, then instantly reset for the next scan — the write to the
// sheet happens in the background, it does not hold up the UI.
function submitOrder() {
  const payload = buildOrderPayload();
  if (!payload) return; // validation failed (e.g. no name) — stay put so it can be fixed
  resetScan();
  queueOrder(payload);
}

// ─── Inventory ────────────────────────────────────────────
// Base list is the full Products catalog (everything), enriched with real
// stock/notes for whatever has actually been scanned and saved before.
// Anything never scanned shows as "not yet counted" rather than a fake 0.
let lowStockOnly = false;

async function loadInventory() {
  const list = document.getElementById('inv-list');

  // Instant path — caches are already warm from preloadCache()
  if (cacheReady && productsCache && stockCache) {
    inventoryCache = buildMergedInventory();
    document.getElementById('inv-count').textContent = inventoryCache.length + ' items';
    filterInventory();
    return;
  }

  // Fallback: caches not ready yet — fetch live just this once
  list.innerHTML = `<div class="loading-state"><div class="spinner"></div>Loading...</div>`;
  await preloadCache(true);
  inventoryCache = buildMergedInventory();
  document.getElementById('inv-count').textContent = inventoryCache.length + ' items';
  filterInventory();
}

function buildMergedInventory() {
  const merged = {};

  // Start with the full Products catalog — this is "everything"
  Object.keys(productsCache || {}).forEach(norm => {
    const p = productsCache[norm];
    merged[norm] = {
      upc: p.upc, name: p.name, vendor: p.vendor,
      stock: null, notes: '', counted: false
    };
  });

  // Overlay real counts for anything that's actually been scanned/saved
  Object.keys(stockCache || {}).forEach(norm => {
    const s = stockCache[norm];
    merged[norm] = {
      upc: s.upc, name: s.name || (merged[norm] && merged[norm].name) || '',
      vendor: s.vendor || (merged[norm] && merged[norm].vendor) || '',
      stock: s.stock, notes: s.notes || '', counted: true
    };
  });

  return Object.values(merged);
}

// Manual pull — forces a real re-check of the sheet (bypasses the version
// cache) in case someone just edited it and you don't want to wait for the
// periodic background check.
async function refreshInventory() {
  const list = document.getElementById('inv-list');
  list.innerHTML = `<div class="loading-state"><div class="spinner"></div>Refreshing...</div>`;
  await preloadCache(true);
  loadInventory();
  showToast('Inventory refreshed');
}

function toggleLowStockFilter() {
  lowStockOnly = !lowStockOnly;
  document.getElementById('low-stock-toggle').style.background = lowStockOnly ? 'var(--danger)' : 'var(--surface2)';
  document.getElementById('low-stock-toggle').style.color      = lowStockOnly ? 'var(--white)'  : 'var(--text)';
  filterInventory();
}

const RENDER_CAP = 200; // never build more DOM rows than this at once — keeps huge catalogs fast

// Filtering/sorting even 36k+ items is fast on its own (simple string/number
// ops) — the render cap above is what actually keeps this responsive, so the
// search reacts on every keystroke with no artificial delay.
function filterInventory() {
  const q      = document.getElementById('inv-search').value.trim().toLowerCase();
  const sortBy = document.getElementById('inv-sort').value;

  let filtered = q
    ? inventoryCache.filter(i =>
        (i.name || '').toLowerCase().includes(q) ||
        String(i.upc || '').includes(q) ||
        (i.vendor || '').toLowerCase().includes(q)
      )
    : inventoryCache;

  // "Low only" applies to items that have actually been counted and are low —
  // never-counted items aren't included since we don't know their real stock.
  if (lowStockOnly) filtered = filtered.filter(i => i.counted && Number(i.stock) <= 5);

  filtered = filtered.sort((a, b) => {
    if (sortBy === 'stock-desc') return stockSortValue(b, true) - stockSortValue(a, true);
    if (sortBy === 'name')       return (a.name  || '').localeCompare(b.name  || '');
    if (sortBy === 'vendor')     return (a.vendor|| '').localeCompare(b.vendor|| '');
    return stockSortValue(a, false) - stockSortValue(b, false); // stock-asc (default)
  });

  renderInventory(filtered);
}

// Never-counted items sort to the end for "low→high" (nothing urgent to act on
// yet) and to the start for "high→low" is avoided too — they just stay last
// either way so real, actionable stock numbers surface first.
function stockSortValue(item, descending) {
  if (!item.counted) return descending ? -1 : Infinity;
  return Number(item.stock);
}

function renderInventory(items) {
  const list = document.getElementById('inv-list');
  if (!items.length) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div>No items found.</div>`; return; }

  const total    = items.length;
  const shown    = items.slice(0, RENDER_CAP);
  const truncated = total > RENDER_CAP;

  const rows = shown.map(item => {
    if (!item.counted) {
      return `<div class="inv-item">
        <div class="inv-dot" style="background:var(--muted)"></div>
        <div class="inv-info">
          <div class="inv-name">${item.name || 'Unknown'}</div>
          <div class="inv-brand">${item.vendor || ''}${item.vendor && item.upc ? ' · ' : ''}${item.upc ? 'SKU ' + item.upc : ''}</div>
        </div>
        <div class="inv-stock" style="color:var(--muted); font-size:11px; font-weight:600;">Not counted</div>
      </div>`;
    }
    const low   = Number(item.stock) <= 5;
    const color = low ? 'var(--danger)' : 'var(--green-mid)';
    return `<div class="inv-item">
      <div class="inv-dot" style="background:${color}"></div>
      <div class="inv-info">
        <div class="inv-name">${item.name || 'Unknown'}</div>
        <div class="inv-brand">${item.vendor || ''}${item.vendor && item.upc ? ' · ' : ''}${item.upc ? 'SKU ' + item.upc : ''}</div>
        ${item.notes ? `<div class="inv-notes">📝 ${item.notes}</div>` : ''}
      </div>
      <div class="inv-stock" style="color:${color}">${item.stock}</div>
    </div>`;
  }).join('');

  const banner = truncated
    ? `<div style="text-align:center; padding:10px; font-size:12px; color:var(--muted); background:var(--surface2); border-radius:8px; margin-bottom:8px;">
         Showing first ${RENDER_CAP} of ${total.toLocaleString()} — type a name or SKU above to narrow it down
       </div>`
    : '';

  list.innerHTML = banner + rows;
}


// ─── Orders ───────────────────────────────────────────────
async function loadOrders() {
  const list = document.getElementById('order-list');
  list.innerHTML = `<div class="loading-state"><div class="spinner"></div>Loading...</div>`;
  const data = await api({ action: 'getOrders' });
  ordersCache = data.orders || [];
  document.getElementById('orders-count').textContent = ordersCache.length + ' items';
  document.getElementById('order-count').textContent  = ordersCache.length;
  renderOrders(ordersCache);
}

function filterOrders() {
  const q = document.getElementById('order-search').value.toLowerCase();
  const filtered = ordersCache.filter(o =>
    (o.name||'').toLowerCase().includes(q) ||
    (o.vendor||'').toLowerCase().includes(q) ||
    String(o.upc||'').includes(q)
  );
  renderOrders(filtered);
}

function renderOrders(orders) {
  const list = document.getElementById('order-list');
  if (!orders.length) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">🛒</div>No orders yet.</div>`; return; }
  list.innerHTML = orders.map(o => `
    <div class="order-item">
      <div class="order-info">
        <div class="order-name">${o.name}</div>
        <div class="order-meta">${o.vendor || 'No vendor'}${o.weight ? ' · ' + o.weight : ''} ${o.staff ? '· <span>' + o.staff + '</span>' : ''}</div>
      </div>
      <div class="order-qty-badge">×${o.qty}</div>
    </div>`).join('');
}

async function clearOrders() {
  if (!confirm('Clear all orders?')) return;
  await api({ action: 'clearOrders' });
  ordersCache = [];
  document.getElementById('order-count').textContent = '0';
  loadOrders();
  showToast('Orders cleared');
}

function exportCSV() {
  if (!ordersCache.length) { showToast('No orders to export'); return; }
  const rows = [['Date','UPC','Product Name','Weight','Vendor','Order Qty','Staff']];
  ordersCache.forEach(o => rows.push([o.date||'', o.upc, o.name, o.weight||'', o.vendor||'', o.qty, o.staff||'']));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `greenvine-orders-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSV exported!');
}

// ─── Helpers ──────────────────────────────────────────────
function resetScan() {
  currentProduct = null;
  productDirty   = false;
  document.getElementById('product-card').classList.remove('visible');
  document.getElementById('qty-keypad').classList.remove('visible');
  document.getElementById('error-msg').style.display = 'none';
  const upc = document.getElementById('manual-upc');
  upc.value = '';
  upc.focus();
}

function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = msg; el.style.display = 'block'; }

let toastTimer;
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error' : ''); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Scanner keyboard flow ────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const upcInput = document.getElementById('manual-upc');
  const qtyInput = document.getElementById('order-qty');

  // Keep inputmode="none" as the default (so the scanner's programmatic
  // focus/typing never pops the on-screen keyboard), but flip it to
  // "numeric" the instant a real finger actually taps the field — then
  // flip it back once they tap away. A scanner-driven focus() call isn't
  // preceded by a touch, so it never triggers this; a genuine tap always does.
  function enableKeyboardOnTap(el) {
    let suppressNextBlur = false;
    const showKeyboard = () => {
      el.setAttribute('inputmode', 'numeric');
      // If it was already focused (common — it auto-focuses after every
      // scan), some browsers won't re-check inputmode without a fresh
      // focus event, so force one — but don't let that self-triggered
      // blur immediately undo what we just set.
      if (document.activeElement === el) {
        suppressNextBlur = true;
        el.blur();
        setTimeout(() => el.focus(), 0);
      }
    };
    const hideKeyboard = () => {
      if (suppressNextBlur) { suppressNextBlur = false; return; }
      el.setAttribute('inputmode', 'none');
    };
    el.addEventListener('touchstart', showKeyboard, { passive: true });
    el.addEventListener('mousedown', showKeyboard);
    el.addEventListener('blur', hideKeyboard);
  }
  enableKeyboardOnTap(upcInput);
  // Note: order-qty intentionally does NOT use enableKeyboardOnTap — its
  // keyboard should pop up automatically after every scan (set via
  // inputmode="numeric" in the HTML), so quantity can be typed by tapping.
  // Scanning the next item straight into this field still works exactly
  // the same either way — see the barcode-in-qty-field detection below.

  // Scanner types UPC + Enter → look up product
  upcInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = upcInput.value.trim();
      if (val) lookupUPC(val);
    }
  });

  // Type quantity + Enter → save to vendor sheet, reset for next scan.
  // The qty field is `readonly` (the most reliable way to block the native
  // Android keyboard across devices — inputmode alone isn't honored by
  // every WebView). readonly still lets keydown events fire normally, so
  // we manually rebuild what's "typed" from those events ourselves, then
  // reflect it into the field's display value via script (readonly only
  // blocks the browser's own default typing behavior, not JS assignment).
  //
  // Since the qty field auto-focuses after every lookup, scanning the
  // *next* item right away (without touching quantity) sends that barcode
  // into this same field instead of the UPC field. Detect that (a real
  // quantity is never 6+ digits; a UPC always is) and treat it as "scan
  // next item": commit whatever's currently shown at its default qty,
  // then look up the newly scanned code — so rapid back-to-back scanning
  // just works, whether or not the field ever visually looked focused.
  let qtyScanBuffer = '';

  qtyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const raw = qtyScanBuffer || qtyInput.value.trim();
      qtyScanBuffer = '';

      if (/^\d{6,}$/.test(raw)) {
        const nextUPC = raw;
        qtyInput.value = '1';
        const payload = buildOrderPayload(); // reads the qty field we just reset to '1'
        if (payload) queueOrder(payload);
        upcInput.value = nextUPC; // reflect the new scan in the search bar, same as a normal scan
        lookupUPC(nextUPC); // move on immediately — no waiting on the save
        return;
      }

      qtyInput.value = raw || '1';
      submitOrder();
      return;
    }

    if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      qtyScanBuffer = qtyFresh ? e.key : (qtyScanBuffer + e.key);
      qtyFresh = false;
      qtyInput.value = qtyScanBuffer;
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      qtyScanBuffer = qtyScanBuffer.slice(0, -1);
      qtyInput.value = qtyScanBuffer;
    }
  });

  // Start loading the catalog the instant the page opens — runs in the
  // background while the PIN is being entered, so it's usually ready
  // before the first scan happens.
  preloadCache();

  // Quietly re-check every 2 minutes in case someone else edits the sheet
  // while this device stays logged in. Cheap no-op if nothing changed.
  setInterval(() => preloadCache(false), 120000);
});
</script>
